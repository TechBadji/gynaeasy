name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            REPO_DIR="/opt/gynaeasy"
            COMPOSE_DIR="/data/coolify/services/k8qo4iwgkv70fwvzdsx4xojk"

            echo "==> Pull..."
            cd $REPO_DIR && git pull origin main

            echo "==> Build..."
            docker build -t gynaeasy-app:latest .

            echo "==> Free port 3001..."
            docker ps --filter publish=3001 --format '{{.Names}}' | xargs -r docker stop || true
            docker ps -a --filter publish=3001 --format '{{.Names}}' | xargs -r docker rm || true

            echo "==> Start..."
            cd $COMPOSE_DIR && docker compose up -d --force-recreate app

            echo "==> Check..."
            sleep 15
            STATUS=$(docker inspect app-k8qo4iwgkv70fwvzdsx4xojk --format '{{.State.Status}}')
            echo "Container: $STATUS"
            curl -sf http://localhost:3001/ > /dev/null && echo "HTTP OK" || echo "HTTP check pending"
